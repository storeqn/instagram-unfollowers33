<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Unfollowers Tool</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:12px;
  background:#0f1115;
  color:#fff;
  font-family:Arial, sans-serif;
}
.container{
  width:100%;
  max-width:900px;
  margin:auto;
}
.card{
  background:#171a21;
  border:1px solid #262a35;
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  overflow:hidden;
}
h1{margin:0 0 10px;font-size:21px}
p{color:#c9d1d9;font-size:14px;line-height:1.6}
label{display:block;margin:8px 0 4px}
input,button{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid #2b3240;
  background:#0f1115;
  color:#fff;
  font-size:14px;
}
button{
  background:#22283a;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#2b3350}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:none;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stat{
  flex:1 1 150px;
  background:#0f1115;
  border:1px solid #2b3240;
  border-radius:12px;
  padding:10px;
  min-width:0;
  text-align:center;
}
.table-wrap{
  width:100%;
  overflow:hidden;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  display:none;
  table-layout:fixed;
}
th,td{
  border-bottom:1px solid #2b3240;
  padding:9px 8px;
  text-align:right;
  vertical-align:middle;
}
th{background:#111420}
th.num,td.num{
  width:48px;
  text-align:center;
}
.account-cell{
  width:auto;
}
.account-row{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  min-width:0;
}
.username{
  direction:ltr;
  unicode-bidi:plaintext;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}
a.open{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  background:#2b3350;
  border:1px solid #3b4568;
  min-width:52px;
  height:30px;
  padding:0 10px;
  border-radius:8px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}
a.open:active{transform:scale(.97)}
.small{font-size:13px;color:#c9d1d9;margin-top:10px}

@media (max-width:600px){
  body{padding:8px}
  .card{padding:12px;border-radius:14px}
  h1{font-size:19px}
  .row{grid-template-columns:1fr}
  .stats{gap:6px}
  .stat{flex:1 1 calc(33.333% - 6px);font-size:12px;padding:8px 5px}
  th,td{padding:8px 5px}
  th.num,td.num{width:38px}
  .account-row{gap:6px}
  .username{font-size:14px}
  a.open{min-width:46px;height:28px;padding:0 8px;font-size:12px}
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>🔍 معرفة من لا يتابعك في إنستغرام</h1>
<p>
ارفع ملف <b>followers_1.json</b> و <b>following.json</b>
من بيانات إنستغرام، وستظهر لك الحسابات التي لا تتابعك.
</p>

<div class="row">
  <div>
    <label>followers_1.json</label>
    <input type="file" id="followers" accept=".json">
  </div>
  <div>
    <label>following.json</label>
    <input type="file" id="following" accept=".json">
  </div>
</div>

<button onclick="analyze()" style="margin-top:12px">تحليل الملفات</button>
</div>

<div class="card">
<div class="stats" id="stats">
  <div class="stat">المتابعين<br><b id="fc">0</b></div>
  <div class="stat">المتابَعين<br><b id="fg">0</b></div>
  <div class="stat">لا يتابعونك<br><b id="nf">0</b></div>
</div>

<div class="table-wrap">
<table id="table">
<thead>
<tr>
  <th class="num">#</th>
  <th>الحساب</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<p class="small">
⚠️ يتم فتح الحسابات يدويًا لتجنب الحظر
</p>
</div>

</div>

<script>
function normalize(u){
  return String(u||"").replace(/^@/,"").toLowerCase();
}

function fromHref(h){
  try{
    let p=new URL(h).pathname.split("/").filter(Boolean);
    return normalize(p[p.length-1]);
  }catch(e){return""}
}

function extract(json){
  let r=[];
  (function walk(x){
    if(!x)return;
    if(Array.isArray(x))return x.forEach(walk);
    if(typeof x==="object"){
      if(x.title)r.push(normalize(x.title));
      if(x.string_list_data)
        x.string_list_data.forEach(s=>{
          if(s.value)r.push(normalize(s.value));
          if(s.href)r.push(fromHref(s.href));
        });
      for(let k in x)walk(x[k]);
    }
  })(json);
  return [...new Set(r)].filter(Boolean);
}

function read(file){
  return new Promise((res,rej)=>{
    let r=new FileReader();
    r.onload=()=>res(JSON.parse(r.result));
    r.onerror=rej;
    r.readAsText(file);
  });
}

async function analyze(){
  let f1=document.getElementById("followers").files[0];
  let f2=document.getElementById("following").files[0];
  if(!f1||!f2){alert("ارفع الملفين");return}

  let followers=extract(await read(f1));
  let following=extract(await read(f2));

  let set=new Set(followers);
  let nf=following.filter(u=>!set.has(u));

  document.getElementById("stats").style.display="flex";
  document.getElementById("table").style.display="table";
  document.getElementById("fc").textContent=followers.length;
  document.getElementById("fg").textContent=following.length;
  document.getElementById("nf").textContent=nf.length;

  let tbody=document.getElementById("tbody");
  tbody.innerHTML="";
  nf.forEach((u,i)=>{
    let tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="num">${i+1}</td>
      <td class="account-cell">
        <div class="account-row">
          <span class="username">@${u}</span>
          <a class="open" href="https://www.instagram.com/${u}/" target="_blank" rel="noopener">فتح</a>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
